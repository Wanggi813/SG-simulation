<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>양자 측정 시뮬레이션</title>
  <meta name="description" content="슈테른-게를라흐 실험과 순차 측정 시뮬레이션 모음입니다." />
  <style>
    :root {
      --bg: #05070c;
      --text: #e8eef6;
      --muted: #8193a8;
      --cyan: #31d8ff;
      --blue: #2f68ff;
      --pink: #ff5d7a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 16px;
    }

    main {
      width: 100%;
      max-width: 1000px;
    }

    h1 {
      margin: 0 0 40px;
      text-align: center;
      font-size: clamp(30px, 6vw, 46px);
      word-break: keep-all;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .shots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
      gap: 32px;
    }

    .shot {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .frame {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .frame img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      filter: brightness(0.82);
      transition: filter 0.25s ease;
    }

    .frame::after {
      content: "시작하기 →";
      position: absolute;
      right: 16px;
      bottom: 16px;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .shot:hover .frame,
    .shot:focus-visible .frame {
      transform: translateY(-6px) scale(1.015);
      border-color: var(--cyan);
      box-shadow: 0 0 0 1px var(--cyan), 0 26px 70px rgba(49, 216, 255, 0.25);
    }

    .shot.seq:hover .frame,
    .shot.seq:focus-visible .frame {
      border-color: var(--pink);
      box-shadow: 0 0 0 1px var(--pink), 0 26px 70px rgba(255, 93, 122, 0.22);
    }

    .shot:hover img,
    .shot:focus-visible img {
      filter: brightness(1);
    }

    .shot:hover .frame::after,
    .shot:focus-visible .frame::after {
      opacity: 1;
      transform: none;
    }

    .shot:focus-visible {
      outline: none;
    }

    @media (hover: none) {
      .frame img {
        filter: none;
      }

      .frame::after {
        opacity: 1;
        transform: none;
      }
    }

    .caption {
      margin-top: 16px;
      text-align: center;
    }

    .caption .num {
      display: block;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .caption h2 {
      margin: 6px 0 0;
      font-size: clamp(26px, 5vw, 30px);
      font-weight: 700;
    }
  </style>
</head>
